<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Portfolio</title>
  <meta name="description" content="Photographer & Director - Campaigns, Documentary films, Long-form photography">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ===== NAVIGATION ===== -->
  <nav class="nav" id="nav">
    <a href="#" class="nav-brand" id="nav-brand">CREATIVE PORTFOLIO</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links"></ul>
  </nav>

  <!-- ===== HERO / LANDING ===== -->
  <header class="hero" id="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-name" id="hero-name">CHRISTOPHER IRELAND</h1>
      <p class="hero-tagline" id="hero-tagline">Photographer | Director</p>
      <p class="hero-sub" id="hero-sub">Campaigns · Documentary films · Long-form photography</p>
    </div>
    <div class="hero-scroll" id="hero-scroll">
      <span class="hero-scroll-line"></span>
    </div>
  </header>

  <!-- ===== SECTIONS ===== -->
  <main id="main-content"></main>

  <!-- ===== WORKS GRID ===== -->
  <section class="section section--dark" id="works-section">
    <div class="container">
      <h2 class="section-title" id="works-title">Advertising Folio</h2>
      <div class="works-grid" id="works-grid"></div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="footer" id="footer">
    <div class="container">
      <div class="footer-grid" id="footer-grid"></div>
    </div>
    <div class="footer-bottom">
      <p id="footer-copy">&copy; 2025 Christopher Ireland Creative. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
