<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页</title>
  <meta name="description" content="摄影师与导演 — 广告摄影、纪录片、长期摄影项目">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <!-- ===== NAVIGATION ===== -->
  <nav class="nav" id="nav">
    <a href="#" class="nav-brand" id="nav-brand">个人主页</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="切换菜单">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links"></ul>
  </nav>

  <!-- ===== HERO / LANDING ===== -->
  <header class="hero" id="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-tagline" id="hero-tagline"></p>
      <p class="hero-sub" id="hero-sub"></p>
    </div>
    <div class="hero-scroll" id="hero-scroll">
      <span class="hero-scroll-line"></span>
    </div>
  </header>

  <!-- ===== SECTIONS ===== -->
  <main id="main-content"></main>

  <!-- ===== WORKS GRID ===== -->
  <section class="section section--dark" id="works-section">
    <div class="container">
      <h2 class="section-title" id="works-title">作品集</h2>
      <div class="works-grid" id="works-grid"></div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="footer" id="footer">
    <div class="container">
      <div class="footer-grid" id="footer-grid"></div>
    </div>
    <div class="footer-bottom">
      <p id="footer-copy"></p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
