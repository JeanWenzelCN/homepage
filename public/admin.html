<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>后台管理 — 个人主页</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- 登录视图 -->
  <div id="login-view" class="login-card">
    <h1>后台管理</h1>
    <p class="login-sub">个人主页内容管理系统</p>
    <input type="password" id="login-key" placeholder="管理员密钥" autocomplete="off">
    <button id="login-btn">登 录</button>
    <p id="login-error" class="error-text" hidden></p>
  </div>

  <!-- 主视图 -->
  <div id="admin-view" hidden>
    <header class="admin-header">
      <h1>站点管理</h1>
      <div class="header-actions">
        <a href="/" target="_blank" class="btn-secondary">查看站点</a>
        <button id="save-btn" class="btn-primary">保存全部</button>
      </div>
    </header>
    <div id="save-status" hidden></div>

    <nav class="admin-tabs">
      <button class="tab-btn active" data-tab="site">站点</button>
      <button class="tab-btn" data-tab="hero">首屏</button>
      <button class="tab-btn" data-tab="nav">导航</button>
      <button class="tab-btn" data-tab="sections">板块</button>
      <button class="tab-btn" data-tab="works">作品</button>
      <button class="tab-btn" data-tab="footer">页脚</button>
      <button class="tab-btn" data-tab="appearance">外观</button>
      <button class="tab-btn" data-tab="json">JSON</button>
    </nav>

    <!-- 站点 -->
    <div class="tab-panel active" id="tab-site">
      <div class="field">
        <label>品牌名（导航栏）</label>
        <input type="text" data-path="site.brand">
      </div>
      <div class="field">
        <label>页面标题</label>
        <input type="text" data-path="site.title">
      </div>
      <div class="field">
        <label>Meta 描述</label>
        <input type="text" data-path="site.description">
      </div>
    </div>

    <!-- 首屏 -->
    <div class="tab-panel" id="tab-hero">
      <div class="field">
        <label>名字</label>
        <input type="text" data-path="hero.name">
      </div>
      <div class="field">
        <label>标语</label>
        <input type="text" data-path="hero.tagline">
      </div>
      <div class="field">
        <label>副标题</label>
        <input type="text" data-path="hero.sub">
      </div>
      <div class="field">
        <label>背景图 URL</label>
        <input type="text" data-path="hero.bgImage">
      </div>
    </div>

    <!-- 导航 -->
    <div class="tab-panel" id="tab-nav">
      <div id="nav-editor"></div>
      <button id="nav-add" class="btn-secondary">＋ 添加导航项</button>
    </div>

    <!-- 板块 -->
    <div class="tab-panel" id="tab-sections">
      <div id="sections-editor"></div>
      <button id="sections-add" class="btn-secondary">＋ 添加板块</button>
    </div>

    <!-- 作品 -->
    <div class="tab-panel" id="tab-works">
      <div id="works-editor"></div>
      <button id="works-add" class="btn-secondary">＋ 添加作品</button>
    </div>

    <!-- 页脚 -->
    <div class="tab-panel" id="tab-footer">
      <div id="footer-editor"></div>
      <button id="footer-add" class="btn-secondary">＋ 添加栏目</button>
      <div class="field">
        <label>版权文字</label>
        <input type="text" data-path="footerCopy">
      </div>
    </div>

    <!-- 外观 -->
    <div class="tab-panel" id="tab-appearance">
      <div class="field">
        <label>主题</label>
        <select data-path="appearance.theme">
          <option value="dark">深色</option>
          <option value="light">浅色</option>
        </select>
      </div>

      <h3 class="appearance-h3">作品集版块</h3>
      <div class="field field-inline">
        <input type="checkbox" id="appearance-showWorks" data-path="appearance.showWorks" checked>
        <label for="appearance-showWorks">显示「作品集」版块</label>
      </div>

      <h3 class="appearance-h3">自定义字体</h3>
      <p class="hint">把字体文件（.woff2 / .woff / .ttf）放到 <code>public/fonts/</code> 目录，然后在这里登记。名称即 CSS font-family。</p>
      <div id="fonts-editor"></div>
      <button id="fonts-add" class="btn-secondary">＋ 添加字体</button>

      <h3 class="appearance-h3">每处文本的字体</h3>
      <p class="hint">留空表示使用默认字体。</p>
      <div id="font-slots"></div>
    </div>

    <!-- JSON -->
    <div class="tab-panel" id="tab-json">
      <textarea id="json-editor" rows="20" spellcheck="false"></textarea>
      <button id="json-apply" class="btn-secondary">应用 JSON</button>
      <p id="json-error" class="error-text" hidden></p>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
